<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* CSS Variables for the "Glass Ledger" Theme */
        :root {
            --slate-900: #0f172a;
            --slate-800: #1e293b;
            --slate-100: #f1f5f9;
            --steel-blue: #3b82f6;
            --steel-blue-hover: #2563eb;
            --steel-glow: rgba(59, 130, 246, 0.45);
            --text-main: #334155;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.7;
            color: var(--text-main);
            background-color: var(--slate-100);
            overflow-x: hidden;
        }

        /* Top Scroll Progress Bar */
        #progress-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(15, 23, 42, 0.8);
            z-index: 200;
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3b82f6, #60a5fa, #93c5fd);
            box-shadow: 0 0 10px var(--steel-blue);
            transition: width 0.1s ease-out;
        }

        /* Centered Sticky Navigation */
        nav {
            background-color: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 0.95rem 2rem 0.85rem 2rem; 
            box-shadow: 0 4px 12px -1px rgba(0, 0, 0, 0.25);
            border-bottom: 1px solid #1e293b;
        }

        .nav-container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--slate-100);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            transition: color 0.2s, transform 0.2s;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0%;
            height: 2px;
            background-color: var(--steel-blue);
            transition: width 0.25s ease;
        }

        .nav-links a:hover {
            color: #60a5fa;
        }

        .nav-links a:hover::after {
            width: 100%;
        }
