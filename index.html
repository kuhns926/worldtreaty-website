<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Treaty for Earth | The Constitution for Earth</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: #0b1120;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }

    /* TOP NAVIGATION BAR */
    .wt-navbar {
      background-color: #0f172a;
      border-bottom: 1px solid #334155;
      padding: 14px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .wt-nav-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .wt-brand {
      text-decoration: none;
      color: #ffffff;
      font-weight: 900;
      font-size: 20px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .wt-nav-links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .wt-btn {
      display: inline-block;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 6px;
      color: #ffffff;
    }
    .wt-btn-ig {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    }
    .wt-btn-fb {
      background-color: #1877f2;
    }
    .wt-btn-primary {
      background-color: #38bdf8;
      color: #0b1120;
      font-weight: 800;
      padding: 12px 24px;
      font-size: 15px;
    }

    /* HERO HEADER */
    .wt-hero {
      background-color: #131c31;
      border-bottom: 1px solid #334155;
      padding: 56px 20px 44px;
      text-align: center;
    }
    .wt-hero-inner {
      max-width: 820px;
      margin: 0 auto;
    }
    .wt-eyebrow {
      display: inline-block;
      background-color: #1e293b;
      color: #38bdf8;
      border: 1px solid #38bdf8;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 5px 14px;
      border-radius: 50px;
      margin-bottom: 16px;
    }
    .wt-hero h1 {
      margin: 0 0 16px 0;
      font-size: 40px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.2;
    }
    .wt-hero-tagline {
      font-size: 19px;
      color: #cbd5e1;
      margin: 0 auto 28px auto;
      max-width: 680px;
    }
    .wt-hero-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    /* MAIN CONTAINER */
    .wt-container {
      max-width: 920px;
      margin: 0 auto;
      padding: 32px 20px 64px;
    }

    /* TOP SOVEREIGNTY BANNER */
    .wt-sovereignty-banner {
      background-color: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 28px;
    }
    .wt-sovereignty-alert {
      margin: 0 0 12px 0;
      font-size: 18px;
      font-weight: 900;
      color: #38bdf8;
      line-height: 1.4;
      text-transform: uppercase;
    }
    .wt-sovereignty-sub {
      margin: 0;
      font-size: 15.5px;
      color: #e2e8f0;
    }

    /* PREAMBLE BAR */
    .wt-header-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      border-left: 4px solid #38bdf8;
      padding: 20px 24px;
      background-color: #1e293b;
      border-radius: 0 10px 10px 0;
      margin-bottom: 28px;
    }
    .wt-header-text {
      flex: 1 1 500px;
    }
    .wt-header-text h2 {
      margin: 0 0 8px 0;
      font-size: 22px;
      color: #ffffff;
      text-transform: uppercase;
    }
    .wt-header-text p {
      margin: 0;
      color: #cbd5e1;
      font-size: 15.5px;
    }
    .wt-toggle-btn {
      background-color: #0f172a;
      color: #38bdf8;
      border: 1px solid #38bdf8;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    /* ARTICLE CARDS & CLEAN TABS */
    .wt-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .wt-headline {
      margin: 0 0 10px 0;
      font-size: 21px;
      font-weight: 800;
      color: #ffffff;
    }
    .wt-quickread {
      margin: 0 0 16px 0;
      font-size: 16px;
      color: #cbd5e1;
    }

    /* NATIVE BULLETPROOF DROPDOWN TABS */
    details.wt-dropdown {
      border-top: 1px solid #334155;
      padding-top: 14px;
    }
    details.wt-dropdown summary {
      cursor: pointer;
      font-weight: 700;
      font-size: 14.5px;
      color: #38bdf8;
      background-color: #0f172a;
      border: 1px solid #334155;
      padding: 10px 16px;
      border-radius: 8px;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    details.wt-dropdown summary::-webkit-details-marker {
      display: none;
    }
    details.wt-dropdown summary::after {
      content: "+ Read Full Policy Architecture ▼";
    }
    details.wt-dropdown[open] summary {
      color: #fca5a5;
      border-color: #f87171;
    }
    details.wt-dropdown[open] summary::after {
      content: "− Hide Full Policy Architecture ▲";
    }
    .wt-policy-body {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px dashed #334155;
      font-size: 15px;
      color: #e2e8f0;
    }
    .wt-policy-body ul {
      margin: 0;
      padding-left: 20px;
    }
    .wt-policy-body li {
      margin-bottom: 12px;
    }

    /* SPREAD-OUT VISUAL BANNERS */
    .wt-visual-break {
      margin: 36px 0;
      background-color: #0f172a;
      border: 1px solid #38bdf8;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-wrap: wrap;
    }
    .wt-visual-img-link {
      flex: 1 1 360px;
      position: relative;
      display: block;
      min-height: 240px;
      background-color: #050811;
    }
    .wt-visual-img-link img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .wt-img-badge {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background-color: #0f172a;
      color: #38bdf8;
      border: 1px solid #38bdf8;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
    }
    .wt-visual-content {
      flex: 1 1 360px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .wt-visual-tag {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #38bdf8;
      margin-bottom: 6px;
    }
    .wt-visual-title {
      margin: 0 0 10px 0;
      font-size: 21px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.3;
    }
    .wt-visual-desc {
      margin: 0 0 20px 0;
      font-size: 15px;
      color: #cbd5e1;
    }
    .wt-social-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    /* FOOTER */
    .wt-footer {
      border-top: 1px solid #334155;
      background-color: #0f172a;
      padding: 40px 20px;
      text-align: center;
      color: #cbd5e1;
      font-size: 14px;
    }
    .wt-footer-links {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 16px 0;
    }
  </style>
</head>
