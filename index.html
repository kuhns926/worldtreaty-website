<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Treaty for Earth | The Constitution for Earth</title>
  <style>
    :root {
      --bg-dark: #070b14;
      --bg-panel: #0f172a;
      --card-bg: #1e293b;
      --border-col: #334155;
      --accent-blue: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.2);
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
    }

    /* TOP NAVIGATION BAR */
    .wt-navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-col);
      padding: 0.85rem 1.5rem;
    }
    .wt-nav-inner {
      max-width: 980px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .wt-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: #ffffff;
      font-weight: 900;
      font-size: 1.2rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .wt-brand-globe {
      font-size: 1.5rem;
    }
    .wt-nav-links {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .wt-nav-btn {
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .wt-nav-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .wt-btn-ig {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: #ffffff;
    }
    .wt-btn-fb {
      background: #1877f2;
      color: #ffffff;
    }

    /* HERO HEADER */
    .wt-hero {
      position: relative;
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #070b14 75%);
      border-bottom: 1px solid var(--border-col);
      padding: 4rem 1.5rem 3rem;
      text-align: center;
    }
    .wt-hero-inner {
      max-width: 820px;
      margin: 0 auto;
    }
    .wt-eyebrow {
      display: inline-block;
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent-blue);
      border: 1px solid var(--accent-blue);
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.3rem 0.85rem;
      border-radius: 999px;
      margin-bottom: 1rem;
    }
    .wt-hero h1 {
      margin: 0 0 1rem 0;
      font-size: clamp(2rem, 5vw, 3.25rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: #ffffff;
    }
    .wt-hero-tagline {
      font-size: clamp(1.05rem, 2.5vw, 1.3rem);
      color: var(--text-muted);
      margin: 0 auto 2rem auto;
      max-width: 680px;
    }
    .wt-hero-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.85rem;
    }
    .wt-cta-primary {
      background: var(--accent-blue);
      color: #070b14;
      font-weight: 800;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }
    .wt-cta-primary:hover {
      background: #7dd3fc;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    /* MAIN CONTAINER */
    .wt-app-container {
      max-width: 920px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    /* TOP SOVEREIGNTY BANNER */
    .wt-sovereignty-banner {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid var(--accent-blue);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      box-shadow: 0 8px 30px var(--accent-glow);
    }
    .wt-sovereignty-alert {
      margin: 0 0 0.75rem 0;
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--accent-blue);
      letter-spacing: 0.03em;
      line-height: 1.4;
      text-transform: uppercase;
    }
    .wt-sovereignty-sub {
      margin: 0;
      font-size: 0.96rem;
      color: var(--text-muted);
    }

    /* PREAMBLE & CONTROLS */
    .wt-header-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      border-left: 4px solid var(--accent-blue);
      padding: 1.25rem 1.5rem;
      background: var(--card-bg);
      border-radius: 0 10px 10px 0;
      margin-bottom: 1.75rem;
    }
    .wt-header-text {
      flex: 1 1 500px;
    }
    .wt-header-text h2 {
      margin: 0 0 0.4rem 0;
      font-size: 1.4rem;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .wt-header-text p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.96rem;
    }
    .wt-toggle-all-btn {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-blue);
      border: 1px solid var(--accent-blue);
      padding: 0.6rem 1.1rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .wt-toggle-all-btn:hover {
      background: var(--accent-blue);
      color: #070b14;
    }

    /* ARTICLE ACCORDION CARDS */
    .wt-card {
      background: var(--card-bg);
      border: 1px solid var(--border-col);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .
